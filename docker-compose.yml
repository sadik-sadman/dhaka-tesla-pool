services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla_pool
      POSTGRES_PASSWORD: tesla_pool_dev_password
      POSTGRES_DB: tesla_pool
    ports:
      - "5432:5432"
    volumes:
      - tesla_pool_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla_pool -d tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://tesla_pool:tesla_pool_dev_password@db:5432/tesla_pool?schema=public"
      JWT_SECRET: "dev-only-secret-change-me"
      JWT_EXPIRES_IN: "1d"
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"

  # `frontend` service is added in a later commit once the Next.js app exists.

volumes:
  tesla_pool_db_data:
